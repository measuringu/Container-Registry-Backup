# ---------------
# Jobs For grabbing images from Docker hub, and storing them in the repo's container registry
# ---------------

# IMAGE: richarvey/nginx-php-fpm:3.1.6
acquire_php_fpm:
  extends:
    - .acquire_image_template
  variables:
    # Image tag example: registry.gitlab.com/measuringu/muiq/muiq1-web-app/my-branch-name:commit-sha-number
    IMAGE_NAME: nginx-php-fpm:3.1.6
    DOCKERFILE: nginx-php-fpm.Dockerfile

# IMAGE: node:20-slim
acquire_node_20slim:
  extends:
    - .acquire_image_template
  variables:
    # Image tag example: registry.gitlab.com/measuringu/muiq/muiq1-web-app/my-branch-name:commit-sha-number
    IMAGE_NAME: node:20-slim
    DOCKERFILE: node-20-slim.Dockerfile
